server {
    listen 443 ssl;
    server_name localhost;

    # Local testing only: self-signed, SAN-correct cert generated for this
    # purpose. Swap to origin_cert.pem once Cloudflare actually issues it
    # for a domain you control (see docs/tls-https-guide, sec. 6).
    ssl_certificate /etc/nginx/certs/local_cert.pem;
    ssl_certificate_key /etc/nginx/certs/local_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # "api" is the Compose service name on the shared network, and 8000
        # is the API's own container port -- not API_PORT (that's only the
        # host-side mapping, meaningless from inside another container).
        proxy_pass http://api:8000;
    }
}