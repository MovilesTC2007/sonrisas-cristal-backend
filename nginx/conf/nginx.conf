map $host $hsts_header {
    default "max-age=31536000";
    localhost "";
    127.0.0.1 "";
    ::1 "";
}

server {
    listen 80;
    server_name _;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/local_cert.pem;
    ssl_certificate_key /etc/nginx/certs/local_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'" always;

    location / {
        proxy_hide_header X-Content-Type-Options;

        # "api" is the Compose service name on the shared network, and 8000
        # is the API's own container port -- not API_PORT (that's only the
        # host-side mapping, meaningless from inside another container).
        proxy_pass http://api:8000;
    }
}