name: security

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          checksum: "bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c"

      - name: Export locked production dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt

    
      # cryptography 45.0.7 (7 IDs): newer versions need cffi>=2.0, blocked by oso (cffi~=1.15).
      #audit: acepted bulnerabilities 
      - name: Audit dependencies for known vulnerabilities
        run: >
          uvx pip-audit@2.10.1 -r requirements-audit.txt --disable-pip --no-deps
          --ignore-vuln PYSEC-2026-4298
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln PYSEC-2026-2141
          --ignore-vuln PYSEC-2026-35
          --ignore-vuln PYSEC-2026-36
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-537c-gmf6-5ccf

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner