name: linter

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Ensure uv is available
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Lint 
        run: uvx ruff check .