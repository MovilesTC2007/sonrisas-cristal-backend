name: linter

on:
  push:
    branches: ["**"]
  pull_request:

# least privilege: el workflow solo lee codigo
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest #virtual machine que provee github (se elimina despues de su uso)
    timeout-minutes: 10 #no more time after the push
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 hashed version
        with:
          persist-credentials: false #sin razon para conservarla

        # checksum verified and 
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0 hashed
        with:
          version: "0.13.10"
          checksum: "bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c"

      - name: Lint 
        run: uvx ruff check .
