name: linter

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Lint (ruff, zero-config, no project dependency added)
        run: uvx ruff check .