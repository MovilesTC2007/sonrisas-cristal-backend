[project]
name = "sonrisas-cristal-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names, etc.)
    "I",   # isort (import sorting/grouping)
    "B",   # flake8-bugbear (likely-bug patterns)
    "UP",  # pyupgrade (modern Python idioms)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
