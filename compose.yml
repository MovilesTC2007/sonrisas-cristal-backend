services:
  db:
    build: ./database/postgre
    env_file: .env
    secrets:
      - password_pepper
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=3775
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sonrisas-network
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${API_DB_USER}:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m,mode=1777
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sonrisas-network

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["security"] # starts when its called
    environment:
      HOME: /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    depends_on:
      - api
    volumes:
      - ./zap-reports:/zap/wrk:rw # reports end up in ./zap-reports
    command: >
      zap-api-scan.py
      -t http://api:8000/openapi.json
      -f openapi
      -r report.html
    networks:
      - sonrisas-network
    # baseline (passive) or full (active attacks) zap-full-scan.py
    # api-scan active attacks on every endpoint in the spec
    # docker compose --profile security run --rm zap
      
  nginx-tls:
    # This image checks that the TLS certificate files exist before Nginx starts.
    build: ./nginx
    image: sonrisas-cristal-nginx:1.27-alpine
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,mode=1777
      - /run:rw,noexec,nosuid,size=1m,mode=1777
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf:/etc/nginx/conf.d:ro
    depends_on:
      - api
    networks:
      - sonrisas-network

  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    command: >
      tunnel --no-autoupdate --url https://nginx-tls:443
      --origin-server-name ${CLOUDFLARED_ORIGIN_SERVER_NAME:-localhost}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      - nginx-tls
    networks:
      - sonrisas-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api
      - postgres-exporter
    networks:
      - sonrisas-network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    command:
      - "--datasource.uri=db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sonrisas-network

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - sonrisas-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  sonrisas-network:
    driver: bridge

secrets:
  password_pepper:
    file: ${PASSWORD_PEPPER_FILE:-./secrets/password_pepper}
