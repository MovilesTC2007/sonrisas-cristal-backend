# Development-only override; Compose does not load this file automatically.
# Include it explicitly with `-f compose.dev.yml` for local development.
services:
  db:
    # Host access to PostgreSQL is available only in the local configuration.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
  api:
    volumes:
      - ./api:/app
    # Direct API access is for local tools and the Android emulator.
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["sh", "-c", "uv sync && fastapi dev main.py --host 0.0.0.0 --port 8000"]
  nginx-tls:
    environment:
      GENERATE_DEV_CERT: "true"
    volumes:
      # The local certificate is stored here and is ignored by Git.
      - ./nginx/certs:/etc/nginx/certs:rw
